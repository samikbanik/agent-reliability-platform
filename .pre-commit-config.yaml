repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: prettier
        name: Prettier
        entry: pnpm exec prettier --write
        language: system
        types_or: [javascript, jsx, json, markdown, ts, tsx, yaml]
