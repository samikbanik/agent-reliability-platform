[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-reliability-common"
version = "0.1.0"
description = "Shared runtime helpers for API, orchestrator, and workers"
requires-python = ">=3.12"
dependencies = [
  "agent-reliability-contracts",
  "pika>=1.3.2",
  "psycopg[binary]>=3.2.0",
  "pydantic-settings>=2.10.0",
  "redis>=5.2.0",
  "sqlalchemy>=2.0.41",
]

[tool.uv.sources]
agent-reliability-contracts = { workspace = true }
